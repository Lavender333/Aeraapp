    <script>
      (function (l) {
        if (l.search && l.search.startsWith('?/')) {
          var path = l.search.slice(2).replace(/~and~/g, '&');
          window.history.replaceState(null, '', '/' + path);
        }
      })(window.location);
    </script>
    <script>
      (function () {
        var BOOT_TIMEOUT_MS = 20000;
        var BANNER_ID = 'aera-bootstrap-timeout';
        var RETRY_KEY = 'aera.assetLoadRetry';
        var firstErrorText = null;

        function getBanner() {
          return document.getElementById(BANNER_ID);
        }

        function renderBanner(message, detail) {
          var banner = getBanner();
          if (!banner) {
            banner = document.createElement('div');
            banner.id = BANNER_ID;
            banner.style.position = 'fixed';
            banner.style.left = '12px';
            banner.style.right = '12px';
            banner.style.top = '12px';
            banner.style.zIndex = '2147483647';
            banner.style.background = '#fff7ed';
            banner.style.border = '1px solid #fdba74';
            banner.style.color = '#7c2d12';
            banner.style.padding = '12px 14px';
            banner.style.borderRadius = '10px';
            banner.style.fontFamily = 'Inter, system-ui, -apple-system, sans-serif';
            banner.style.boxShadow = '0 6px 24px rgba(0,0,0,0.12)';
            document.body.appendChild(banner);
          }

          banner.innerHTML = [
            '<div style="font-size:13px;font-weight:700;line-height:1.3;">' + message + '</div>',
            '<div style="font-size:12px;line-height:1.45;margin-top:4px;white-space:pre-wrap;">' + detail + '</div>'
          ].join('');
        }

        function normalizeError(value) {
          if (!value) return 'Unknown error';
          if (typeof value === 'string') return value;
          if (value.message) return String(value.message);
          try {
            return JSON.stringify(value);
          } catch (e) {
            return String(value);
          }
        }

        function isExpectedCancellation(value) {
          var name = value && value.name ? String(value.name).toLowerCase() : '';
          var code = value && value.code ? String(value.code).toLowerCase() : '';
          var message = normalizeError(value).toLowerCase();
          return name === 'aborterror' ||
            code === 'abort_err' ||
            code === '20' ||
            message === 'the operation was aborted.' ||
            message === 'the operation was aborted' ||
            message.indexOf('signal is aborted') !== -1;
        }

        function showBootstrapTimeout() {
          if (window.__AERA_BOOTED__) return;
          var detail = firstErrorText
            ? ('First error: ' + firstErrorText)
            : 'The app bootstrap timed out. This is usually a blocked script, stale cache, or browser compatibility issue. Try Cmd+Shift+R.';
          renderBanner('AERA did not finish loading', detail);
        }

        function shouldRetryAssetLoad(src) {
          return typeof src === 'string' && /\/assets\/(index|polyfills|.*legacy).*\.js($|\?)/i.test(src);
        }

        function retryWithCacheBust() {
          try {
            if (window.sessionStorage.getItem(RETRY_KEY) === '1') return false;
            window.sessionStorage.setItem(RETRY_KEY, '1');
            var url = new URL(window.location.href);
            url.searchParams.set('v', String(Date.now()));
            window.location.replace(url.toString());
            return true;
          } catch (e) {
            return false;
          }
        }

        window.addEventListener('error', function (event) {
          if (window.__AERA_BOOTED__) return;
          if (isExpectedCancellation(event && event.error)) return;
          var target = event && event.target;
          var loadError = target && target.tagName === 'SCRIPT' && target.src
            ? ('Script failed to load: ' + target.src)
            : null;
          firstErrorText = firstErrorText || loadError || normalizeError(event && (event.error || event.message));
          if (target && target.tagName === 'SCRIPT' && shouldRetryAssetLoad(target.src) && retryWithCacheBust()) {
            renderBanner('AERA is refreshing', 'A startup asset failed to load. Retrying once with a fresh copy…');
            return;
          }
          renderBanner('AERA startup error', firstErrorText || 'Unknown startup error');
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          if (isExpectedCancellation(event && event.reason)) {
            event.preventDefault();
            return;
          }
          if (window.__AERA_BOOTED__) return;
          firstErrorText = firstErrorText || normalizeError(event && event.reason);
          renderBanner('AERA startup rejection', firstErrorText || 'Unhandled promise rejection');
        });

        window.setTimeout(showBootstrapTimeout, BOOT_TIMEOUT_MS);

        window.setInterval(function () {
          if (!window.__AERA_BOOTED__) return;
          try { window.sessionStorage.removeItem(RETRY_KEY); } catch (e) {}
          var banner = getBanner();
          if (banner && banner.parentNode) {
            banner.parentNode.removeChild(banner);
          }
        }, 1000);
      })();
    </script>
<link rel="stylesheet" href="./index.css">
</head>

    <div id="root"></div>
